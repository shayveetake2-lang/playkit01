<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#D4AF77"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Ground -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FAF9F5" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#D4AF77" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Archival Corner Markers -->
  <path d="M 60 84 L 60 60 L 84 60" fill="none" stroke="#D4AF77" stroke-width="2" stroke-linecap="square"/>
  <path d="M 452 84 L 452 60 L 428 60" fill="none" stroke="#D4AF77" stroke-width="2" stroke-linecap="square"/>
  <path d="M 60 428 L 60 452 L 84 452" fill="none" stroke="#D4AF77" stroke-width="2" stroke-linecap="square"/>
  <path d="M 452 428 L 452 452 L 428 452" fill="none" stroke="#D4AF77" stroke-width="2" stroke-linecap="square"/>

  <!-- Brackets and Monogram -->
  <text x="140" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="300" fill="#8C7A6B" text-anchor="middle" letter-spacing="-0.05em">&#123;</text>
  <text x="256" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="400" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.02em">P</text>
  <text x="372" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="300" fill="#8C7A6B" text-anchor="middle" letter-spacing="-0.05em">&#125;</text>

  <!-- Subtitle Seal -->
  <text x="256" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#FAF9F5" text-anchor="middle" letter-spacing="0.32em" opacity="0.9">PLAYKIT 01</text>
</svg>
