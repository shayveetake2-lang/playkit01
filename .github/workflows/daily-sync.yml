name: Daily Fourthwall Catalog Sync

on:
  schedule:
    # Runs daily at 04:00 UTC (16:00 NZDT / 21:00 PDT)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync Fourthwall Storefront Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Fourthwall Catalog Sync
        run: node scripts/sync-fourthwall.js
        env:
          NEXT_PUBLIC_FOURTHWALL_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN || secrets.NEXT_PUBLIC_FOURTHWALL_TOKEN }}
          NEXT_PUBLIC_FOURTHWALL_API_URL: https://storefront-api.fourthwall.com/v1

      - name: Check for catalog modifications
        id: git-check
        run: |
          if [ -n "$(git status --porcelain src/data/fourthwallProducts.ts)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in Fourthwall catalog dataset."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Catalog is up to date."
          fi

      - name: Commit and push updated catalog
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fourthwallProducts.ts
          git commit -m "chore(catalog): automated daily sync of Fourthwall catalog"
          git push

